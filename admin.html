<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ASIRASHOP ADMIN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family: Arial, "Noto Sans Thai", sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid #292932;
      border-radius: 18px;
      background: #131319;
      box-shadow: 0 20px 60px rgba(0,0,0,.35);
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(135deg, #ffffff, #777);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 24px;
    }

    .login-box h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .login-box p {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #33333d;
      border-radius: 10px;
      background: #0c0c10;
      color: white;
      padding: 12px;
      outline: none;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #777;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .btn-primary {
      background: white;
      color: black;
    }

    .btn-dark {
      background: #22222b;
      color: white;
    }

    .btn-danger {
      background: #8d2020;
      color: white;
    }

    .btn-success {
      background: #236b3b;
      color: white;
    }

    .full {
      width: 100%;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
    }

    /* ADMIN */

    #adminPage {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,11,15,.95);
      border-bottom: 1px solid #25252d;
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
    }

    .brand span {
      color: #999;
      font-size: 12px;
      display: block;
      font-weight: normal;
      margin-top: 3px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
    }

    .page-title p {
      color: #999;
      margin: 7px 0 0;
    }

    .card {
      background: #131319;
      border: 1px solid #282831;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h3 {
      margin: 0;
    }

    /* GAMES */

    #gamesList {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .game-card {
      border: 1px solid #2b2b35;
      border-radius: 14px;
      padding: 15px;
      background: #0e0e13;
    }

    .game-head {
      display: flex;
      gap: 13px;
      align-items: center;
    }

    .game-icon {
      width: 60px;
      height: 60px;
      border-radius: 14px;
      object-fit: cover;
      background: #24242c;
      flex-shrink: 0;
    }

    .game-name {
      font-weight: bold;
      font-size: 18px;
    }

    .game-slug {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status-on {
      background: #173d25;
      color: #70d891;
    }

    .status-off {
      background: #3d1919;
      color: #ff8585;
    }

    .game-description {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      background: #15151c;
      border: 1px solid #30303a;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 25px;
      cursor: pointer;
    }

    .preview-image {
      width: 100%;
      max-height: 200px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    /* MOBILE */

    @media (max-width: 700px) {
      .grid,
      #gamesList {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        padding: 13px 15px;
      }

      .container {
        padding: 20px 15px 50px;
      }

      .page-title h2 {
        font-size: 23px;
      }

      .game-actions {
        flex-wrap: wrap;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       LOGIN PAGE
  ========================== -->

  <section id="loginPage">

    <div class="login-box">

      <div class="login-logo">
        AS
      </div>

      <h1>ASIRASHOP</h1>

      <p>ระบบจัดการร้านค้า</p>

      <div class="field">
        <label for="adminEmail">อีเมลแอดมิน</label>

        <input
          id="adminEmail"
          type="email"
          placeholder="กรอกอีเมล"
          autocomplete="email"
        >
      </div>

      <div class="field">
        <label for="adminPassword">รหัสผ่าน</label>

        <input
          id="adminPassword"
          type="password"
          placeholder="กรอกรหัสผ่าน"
          autocomplete="current-password"
        >
      </div>

      <button
        id="loginButton"
        class="btn btn-primary full"
      >
        เข้าสู่ระบบ
      </button>

      <div id="loginMessage"></div>

    </div>

  </section>


  <!-- =========================
       ADMIN PAGE
  ========================== -->

  <section id="adminPage" class="hidden">

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">
          ASIRASHOP
          <span>ADMIN PANEL</span>
        </div>

        <button
          id="logoutButton"
          class="btn btn-dark"
        >
          ออกจากระบบ
        </button>

      </div>

    </header>


    <main class="container">

      <div class="page-title">

        <h2>แผงควบคุมร้านค้า</h2>

        <p>
          จัดการเกม สินค้า รูปภาพ ราคา และสต็อกของ ASIRASHOP
        </p>

      </div>


      <!-- =========================
           SHOP SETTINGS
      ========================== -->

      <section class="card">

        <h3>ตั้งค่าร้าน</h3>

        <div class="grid">

          <div class="field">

            <label>ชื่อร้าน</label>

            <input
              id="shopName"
              type="text"
              value="ASIRASHOP"
            >

          </div>


          <div class="field">

            <label>คำโปรยร้าน</label>

            <input
              id="shopTagline"
              type="text"
              value="ร้านขายไอดีเกม"
            >

          </div>

        </div>


        <button
          id="saveShopSettings"
          class="btn btn-primary"
        >
          บันทึกการตั้งค่า
        </button>

      </section>


      <!-- =========================
           GAMES
      ========================== -->

      <section class="card">

        <div class="section-header">

          <h3>จัดการเกม</h3>

          <button
            id="addGameButton"
            class="btn btn-primary"
          >
            + เพิ่มเกม
          </button>

        </div>


        <div id="gamesList">

          <p>
            กำลังโหลดเกม...
          </p>

        </div>

      </section>


      <!-- =========================
           PRODUCTS
      ========================== -->
<section class="card">

  <div class="section-header">

    <h3>สินค้า</h3>

    <button
      id="addProductButton"
      class="btn btn-primary"
      type="button"
    >
      + เพิ่มสินค้า
    </button>

  </div>

  <div id="productsList">

    <p style="color:#888;">
      กำลังโหลดสินค้า...
    </p>

  </div>

</section>
      
      <!-- =========================
           QUICK INFO
      ========================== -->

      <section class="card">

        <h3>สถานะระบบ</h3>

        <p id="adminStatus">
          กำลังตรวจสอบบัญชี...
        </p>

      </section>

    </main>

  </section>


  <!-- =========================
       GAME MODAL
  ========================== -->

  <div
    id="gameModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h3 id="gameModalTitle">
          เพิ่มเกม
        </h3>

        <button
          id="closeGameModal"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <input
        id="gameId"
        type="hidden"
      >


      <div class="field">

        <label>
          ชื่อเกม
        </label>

        <input
          id="gameName"
          type="text"
          placeholder="เช่น eFootball Mobile"
        >

      </div>


      <div class="field">

        <label>
          Slug
        </label>

        <input
          id="gameSlug"
          type="text"
          placeholder="เช่น efootball"
        >

      </div>


      <div class="field">

        <label>
          คำอธิบาย
        </label>

        <textarea
          id="gameDescription"
          rows="4"
          placeholder="รายละเอียดเกม"
        ></textarea>

      </div>


      <div class="field">

        <label>
          ลิงก์รูปไอคอน
        </label>

        <input
          id="gameIconUrl"
          type="url"
          placeholder="https://..."
        >

        <img
          id="gameIconPreview"
          class="preview-image"
          alt="Preview"
        >

      </div>


      <div class="field">

        <label>
          ลิงก์รูป Banner
        </label>

        <input
          id="gameBannerUrl"
          type="url"
          placeholder="https://..."
        >

        <img
          id="gameBannerPreview"
          class="preview-image"
          alt="Preview"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>
            ลำดับการแสดง
          </label>

          <input
            id="gameSortOrder"
            type="number"
            value="0"
          >

        </div>


        <div class="field">

          <label>
            สถานะ
          </label>

          <select id="gameActive">

            <option value="true">
              เปิดแสดง
            </option>

            <option value="false">
              ซ่อน
            </option>

          </select>

        </div>

      </div>


      <div class="modal-actions">

        <button
          id="cancelGameButton"
          class="btn btn-dark"
          type="button"
        >
          ยกเลิก
        </button>

        <button
          id="saveGameButton"
          class="btn btn-primary"
          type="button"
        >
          บันทึกเกม
        </button>

      </div>

    </div>

  </div>


  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Supabase connection -->
  <script src="supabase.js"></script>

  <!-- Admin system -->
  <script src="admin.js"></script>


  <!-- =========================
       BASIC ADMIN FUNCTIONS
  ========================== -->

  <script>

    /*
      ตรวจสอบว่ามี Supabase client หรือไม่
    */

    window.addEventListener("load", () => {

      if (!window.supabaseClient) {

        console.error("Supabase client not found.");

        const message =
          document.getElementById("loginMessage");

        if (message) {

          message.textContent =
            "ไม่พบการเชื่อมต่อ Supabase";

        }

        return;

      }

    });


    /*
      เปิด/ปิด Modal
    */

    const gameModal =
      document.getElementById("gameModal");

    const addGameButton =
      document.getElementById("addGameButton");

    const closeGameModal =
      document.getElementById("closeGameModal");

    const cancelGameButton =
      document.getElementById("cancelGameButton");


    function openGameModal() {

      gameModal.classList.remove("hidden");

    }


    function closeGameModalFunction() {

      gameModal.classList.add("hidden");

    }


    if (addGameButton) {

      addGameButton.addEventListener(
        "click",
        () => {

          document.getElementById("gameModalTitle")
            .textContent = "เพิ่มเกม";

          document.getElementById("gameId")
            .value = "";

          document.getElementById("gameName")
            .value = "";

          document.getElementById("gameSlug")
            .value = "";

          document.getElementById("gameDescription")
            .value = "";

          document.getElementById("gameIconUrl")
            .value = "";

          document.getElementById("gameBannerUrl")
            .value = "";

          document.getElementById("gameSortOrder")
            .value = "0";

          document.getElementById("gameActive")
            .value = "true";

          openGameModal();

        }
      );

    }


    if (closeGameModal) {

      closeGameModal.addEventListener(
        "click",
        closeGameModalFunction
      );

    }


    if (cancelGameButton) {

      cancelGameButton.addEventListener(
        "click",
        closeGameModalFunction
      );

    }


    /*
      Preview รูป
    */

    const iconUrl =
      document.getElementById("gameIconUrl");

    const iconPreview =
      document.getElementById("gameIconPreview");


    if (iconUrl) {

      iconUrl.addEventListener(
        "input",
        () => {

          if (!iconUrl.value.trim()) {

            iconPreview.style.display = "none";

            return;

          }

          iconPreview.src =
            iconUrl.value.trim();

          iconPreview.style.display =
            "block";

        }
      );

    }


    const bannerUrl =
      document.getElementById("gameBannerUrl");

    const bannerPreview =
      document.getElementById("gameBannerPreview");


    if (bannerUrl) {

      bannerUrl.addEventListener(
        "input",
        () => {

          if (!bannerUrl.value.trim()) {

            bannerPreview.style.display = "none";

            return;

          }

          bannerPreview.src =
            bannerUrl.value.trim();

          bannerPreview.style.display =
            "block";

        }
      );

    }


    /*
      ปุ่มเพิ่มสินค้า
      ตอนนี้ยังไม่ทำงาน
      จะเชื่อมตาราง Products ในขั้นต่อไป
    */

    const addProductButton =
      document.getElementById("addProductButton");


    if (addProductButton) {

      addProductButton.addEventListener(
        "click",
        () => {

          alert(
            "ระบบเพิ่มสินค้าจะเปิดใช้งานหลังจากสร้างตารางสินค้า"
          );

        }
      );

    }


  </script>

</body>
</html>
