<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASIRASHOP ADMIN</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: #f5f5f5;
      font-family:
        Arial,
        "Noto Sans Thai",
        sans-serif;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    .hidden {
      display: none !important;
    }

    /* LOGIN */

    #loginPage {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 30px;
      border: 1px solid #292932;
      border-radius: 18px;
      background: #131319;
      box-shadow:
        0 20px 60px rgba(0,0,0,.35);
    }

    .login-logo {
      width: 80px;
      height: 80px;
      margin: 0 auto 18px;
      border-radius: 20px;
      background: linear-gradient(
        135deg,
        #fff,
        #777
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: #000;
      font-weight: 900;
      font-size: 24px;
    }

    .login-box h1 {
      text-align: center;
      margin: 0 0 8px;
    }

    .login-box p {
      text-align: center;
      color: #999;
      margin-bottom: 25px;
    }

    /* COMMON */

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      color: #ccc;
      font-size: 14px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #33333d;
      border-radius: 10px;
      background: #0c0c10;
      color: white;
      padding: 12px;
      outline: none;
    }

    .field textarea {
      resize: vertical;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #777;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      transition: .2s;
    }

    .btn:hover {
      transform: translateY(-1px);
      opacity: .9;
    }

    .btn:disabled {
      opacity: .5;
      cursor: not-allowed;
      transform: none;
    }

    .btn-primary {
      background: white;
      color: black;
    }

    .btn-dark {
      background: #22222b;
      color: white;
    }

    .btn-danger {
      background: #8d2020;
      color: white;
    }

    .full {
      width: 100%;
    }

    #loginMessage {
      margin-top: 15px;
      text-align: center;
      color: #ff7777;
      min-height: 20px;
      line-height: 1.5;
    }

    /* ADMIN */

    #adminPage {
      min-height: 100vh;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(11,11,15,.95);
      border-bottom: 1px solid #25252d;
      backdrop-filter: blur(12px);
    }

    .topbar-inner {
      max-width: 1200px;
      margin: auto;
      padding: 15px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      font-size: 21px;
      font-weight: 900;
    }

    .brand span {
      color: #999;
      font-size: 12px;
      display: block;
      font-weight: normal;
      margin-top: 3px;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 25px 20px 60px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h2 {
      margin: 0;
      font-size: 28px;
    }

    .page-title p {
      color: #999;
      margin: 7px 0 0;
    }

    .card {
      background: #131319;
      border: 1px solid #282831;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .card h3 {
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 15px;
    }

    .section-header h3 {
      margin: 0;
    }

    /* GAME / PRODUCT LIST */

    #gamesList,
    #productsList {
      display: grid;
      grid-template-columns:
        repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .game-card {
      border: 1px solid #2b2b35;
      border-radius: 14px;
      padding: 15px;
      background: #0e0e13;
    }

    .game-head {
      display: flex;
      gap: 13px;
      align-items: center;
    }

    .game-icon {
      width: 70px;
      height: 70px;
      border-radius: 14px;
      object-fit: cover;
      background: #24242c;
      flex-shrink: 0;
    }

    .game-name {
      font-weight: bold;
      font-size: 18px;
    }

    .game-slug {
      color: #777;
      font-size: 12px;
      margin-top: 4px;
    }

    .game-description {
      color: #aaa;
      font-size: 14px;
      margin: 12px 0;
      line-height: 1.5;
    }

    .status {
      display: inline-block;
      margin-top: 10px;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
    }

    .status-on {
      background: #173d25;
      color: #70d891;
    }

    .status-off {
      background: #3d1919;
      color: #ff8585;
    }

    .game-actions {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-box {
      width: 100%;
      max-width: 650px;
      background: #15151c;
      border: 1px solid #30303a;
      border-radius: 18px;
      padding: 22px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h3 {
      margin: 0;
    }

    .close-btn {
      background: transparent;
      border: 0;
      color: #aaa;
      font-size: 25px;
      cursor: pointer;
    }

    .preview-image {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      border-radius: 10px;
      margin-top: 10px;
      display: none;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .loading {
      color: #888;
    }

    .error {
      color: #ff7777;
      line-height: 1.6;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .grid,
      #gamesList,
      #productsList {
        grid-template-columns: 1fr;
      }

      .topbar-inner {
        padding: 13px 15px;
      }

      .container {
        padding: 20px 15px 50px;
      }

      .page-title h2 {
        font-size: 23px;
      }

    }

  </style>

</head>


<body>


  <!-- =========================
       LOGIN
  ========================== -->

  <section id="loginPage">

    <div class="login-box">

      <div class="login-logo">
        AS
      </div>

      <h1>
        ASIRASHOP
      </h1>

      <p>
        ระบบจัดการร้านค้า
      </p>


      <div class="field">

        <label>
          อีเมลแอดมิน
        </label>

        <input
          id="adminEmail"
          type="email"
          placeholder="กรอกอีเมล"
          autocomplete="email"
        >

      </div>


      <div class="field">

        <label>
          รหัสผ่าน
        </label>

        <input
          id="adminPassword"
          type="password"
          placeholder="กรอกรหัสผ่าน"
          autocomplete="current-password"
        >

      </div>


      <button
        id="loginButton"
        class="btn btn-primary full"
        type="button"
      >
        เข้าสู่ระบบ
      </button>


      <div id="loginMessage"></div>

    </div>

  </section>



  <!-- =========================
       ADMIN
  ========================== -->

  <section
    id="adminPage"
    class="hidden"
  >

    <header class="topbar">

      <div class="topbar-inner">

        <div class="brand">

          ASIRASHOP

          <span>
            ADMIN PANEL
          </span>

        </div>


        <button
          id="logoutButton"
          class="btn btn-dark"
          type="button"
        >
          ออกจากระบบ
        </button>

      </div>

    </header>



    <main class="container">


      <div class="page-title">

        <h2>
          แผงควบคุมร้านค้า
        </h2>

        <p>
          จัดการเกม สินค้า ราคา รูปภาพ และสต็อก
        </p>

      </div>



      <!-- SHOP -->

      <section class="card">

        <h3>
          ตั้งค่าร้าน
        </h3>

        <div class="grid">

          <div class="field">

            <label>
              ชื่อร้าน
            </label>

            <input
              id="shopName"
              type="text"
              value="ASIRASHOP"
            >

          </div>


          <div class="field">

            <label>
              คำโปรยร้าน
            </label>

            <input
              id="shopTagline"
              type="text"
              value="ร้านขายไอดีเกม"
            >

          </div>

        </div>


        <button
          id="saveShopSettings"
          class="btn btn-primary"
          type="button"
        >
          บันทึกการตั้งค่า
        </button>

      </section>



      <!-- GAMES -->

      <section class="card">

        <div class="section-header">

          <h3>
            จัดการเกม
          </h3>

          <button
            id="addGameButton"
            class="btn btn-primary"
            type="button"
          >
            + เพิ่มเกม
          </button>

        </div>


        <div id="gamesList">

          <p class="loading">
            กำลังโหลดเกม...
          </p>

        </div>

      </section>



      <!-- PRODUCTS -->

      <section class="card">

        <div class="section-header">

          <h3>
            สินค้า
          </h3>

          <button
            id="addProductButton"
            class="btn btn-primary"
            type="button"
          >
            + เพิ่มสินค้า
          </button>

        </div>


        <div id="productsList">

          <p class="loading">
            กำลังโหลดสินค้า...
          </p>

        </div>

      </section>



      <!-- STATUS -->

      <section class="card">

        <h3>
          สถานะระบบ
        </h3>

        <p id="adminStatus">
          กำลังตรวจสอบบัญชี...
        </p>

      </section>


    </main>

  </section>



  <!-- =========================
       GAME MODAL
  ========================== -->

  <div
    id="gameModal"
    class="modal hidden"
  >

    <div class="modal-box">


      <div class="modal-header">

        <h3 id="gameModalTitle">
          เพิ่มเกม
        </h3>

        <button
          id="closeGameModal"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <input
        id="gameId"
        type="hidden"
      >


      <div class="field">

        <label>
          ชื่อเกม
        </label>

        <input
          id="gameName"
          type="text"
          placeholder="เช่น eFootball Mobile"
        >

      </div>


      <div class="field">

        <label>
          Slug
        </label>

        <input
          id="gameSlug"
          type="text"
          placeholder="เช่น efootball"
        >

      </div>


      <div class="field">

        <label>
          คำอธิบาย
        </label>

        <textarea
          id="gameDescription"
          rows="4"
          placeholder="รายละเอียดเกม"
        ></textarea>

      </div>


      <div class="field">

        <label>
          ลิงก์รูปไอคอน
        </label>

        <input
          id="gameIconUrl"
          type="url"
          placeholder="https://..."
        >

        <img
          id="gameIconPreview"
          class="preview-image"
          alt="Preview"
        >

      </div>


      <div class="field">

        <label>
          ลิงก์รูป Banner
        </label>

        <input
          id="gameBannerUrl"
          type="url"
          placeholder="https://..."
        >

        <img
          id="gameBannerPreview"
          class="preview-image"
          alt="Preview"
        >

      </div>


      <div class="grid">

        <div class="field">

          <label>
            ลำดับการแสดง
          </label>

          <input
            id="gameSortOrder"
            type="number"
            value="0"
          >

        </div>


        <div class="field">

          <label>
            สถานะ
          </label>

          <select id="gameActive">

            <option value="true">
              เปิดแสดง
            </option>

            <option value="false">
              ซ่อน
            </option>

          </select>

        </div>

      </div>


      <div class="modal-actions">

        <button
          id="cancelGameButton"
          class="btn btn-dark"
          type="button"
        >
          ยกเลิก
        </button>

        <button
          id="saveGameButton"
          class="btn btn-primary"
          type="button"
        >
          บันทึกเกม
        </button>

      </div>


    </div>

  </div>



  <!-- =========================
       PRODUCT MODAL
  ========================== -->

  <div
    id="productModal"
    class="modal hidden"
  >

    <div class="modal-box">


      <div class="modal-header">

        <h3 id="productModalTitle">
          เพิ่มสินค้า
        </h3>

        <button
          id="closeProductModal"
          class="close-btn"
          type="button"
        >
          ×
        </button>

      </div>


      <input
        id="productId"
        type="hidden"
      >


      <div class="field">

        <label>
          เกม
        </label>

        <select id="productGame">

          <option value="">
            กำลังโหลดเกม...
          </option>

        </select>

      </div>


      <div class="field">

        <label>
          ชื่อสินค้า
        </label>

        <input
          id="productName"
          type="text"
          placeholder="เช่น ไอดี Messi"
        >

      </div>


      <div class="field">

        <label>
          ราคา
        </label>

        <input
          id="productPrice"
          type="number"
          min="0"
          step="0.01"
          placeholder="เช่น 299"
        >

      </div>


      <div class="field">

        <label>
          จำนวนสต็อก
        </label>

        <input
          id="productStock"
          type="number"
          min="0"
          step="1"
          value="1"
        >

      </div>


      <div class="field">

        <label>
          รายละเอียด
        </label>

        <textarea
          id="productDescription"
          rows="4"
          placeholder="รายละเอียดสินค้า"
        ></textarea>

      </div>


      <div class="field">

        <label>
          รูปสินค้า
        </label>

        <input
          id="productImage"
          type="file"
          accept="image/*"
        >

        <img
          id="productImagePreview"
          class="preview-image"
          alt="Preview"
        >

      </div>


      <div class="grid">


        <div class="field">

          <label>
            ลำดับ
          </label>

          <input
            id="productSortOrder"
            type="number"
            value="0"
          >

        </div>


        <div class="field">

          <label>
            สถานะ
          </label>

          <select id="productStatus">

            <option value="available">
              พร้อมขาย
            </option>

            <option value="sold_out">
              สินค้าหมด
            </option>

            <option value="hidden">
              ซ่อน
            </option>

          </select>

        </div>


      </div>


      <div class="modal-actions">

        <button
          id="cancelProductButton"
          class="btn btn-dark"
          type="button"
        >
          ยกเลิก
        </button>


        <button
          id="saveProductButton"
          class="btn btn-primary"
          type="button"
        >
          บันทึกสินค้า
        </button>

      </div>


    </div>

  </div>



  <!-- =========================
       SCRIPTS
  ========================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script src="supabase.js"></script>

  <script src="admin.js"></script>


</body>

</html>
