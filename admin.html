<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>ASIRASHOP Admin</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- ========================================
       LOGIN
  ========================================= -->

  <section id="loginPage" class="login-page">

    <div class="login-box">

      <div class="login-logo">
        ASIRA
      </div>

      <h1>ASIRASHOP</h1>

      <p class="login-subtitle">
        ระบบจัดการร้านค้า
      </p>

      <form id="loginForm">

        <label>
          อีเมล
        </label>

        <input
          type="email"
          id="loginEmail"
          placeholder="admin@email.com"
          autocomplete="email"
          required
        >

        <label>
          รหัสผ่าน
        </label>

        <input
          type="password"
          id="loginPassword"
          placeholder="รหัสผ่าน"
          autocomplete="current-password"
          required
        >

        <button
          type="submit"
          id="loginButton"
          class="primary-button"
        >
          เข้าสู่ระบบ
        </button>

      </form>

      <div
        id="loginMessage"
        class="message"
      ></div>

    </div>

  </section>


  <!-- ========================================
       ADMIN
  ========================================= -->

  <section id="adminPage" class="admin-page hidden">

    <!-- HEADER -->

    <header class="admin-header">

      <div>

        <div class="admin-brand">
          ASIRASHOP
        </div>

        <div class="admin-title">
          Admin Panel
        </div>

      </div>

      <button
        id="logoutButton"
        class="logout-button"
      >
        ออกจากระบบ
      </button>

    </header>


    <!-- STATUS -->

    <div
      id="adminStatus"
      class="admin-status"
    >
      กำลังโหลด...
    </div>


    <!-- ========================================
         SHOP SETTINGS
    ========================================= -->

    <section class="admin-card">

      <div class="card-header">

        <div>

          <h2>ตั้งค่าร้าน</h2>

          <p>
            ตั้งค่าข้อมูลพื้นฐานของ ASIRASHOP
          </p>

        </div>

      </div>


      <div class="form-grid">

        <div class="form-group">

          <label>
            ชื่อร้าน
          </label>

          <input
            type="text"
            id="shopName"
            value="ASIRASHOP"
          >

        </div>


        <div class="form-group">

          <label>
            คำโปรย
          </label>

          <input
            type="text"
            id="shopTagline"
            placeholder="ร้านเติมเกม / ขายไอดี"
          >

        </div>


        <div class="form-group">

          <label>
            LINE
          </label>

          <input
            type="text"
            id="shopLine"
            value="@shtt01"
          >

        </div>


        <div class="form-group">

          <label>
            Instagram
          </label>

          <input
            type="text"
            id="shopInstagram"
            value="soulswoon._"
          >

        </div>

      </div>


      <button
        id="saveShopButton"
        class="primary-button"
      >
        บันทึกตั้งค่าร้าน
      </button>

    </section>


    <!-- ========================================
         GAMES
    ========================================= -->

    <section class="admin-card">

      <div class="card-header">

        <div>

          <h2>จัดการเกม</h2>

          <p>
            เพิ่ม / แก้ไข / ลบ / ซ่อนเกม
          </p>

        </div>

        <button
          id="addGameButton"
          class="primary-button"
        >
          + เพิ่มเกม
        </button>

      </div>


      <div
        id="gamesList"
        class="items-list"
      ></div>

    </section>


    <!-- ========================================
         PRODUCTS
    ========================================= -->

    <section class="admin-card">

      <div class="card-header">

        <div>

          <h2>จัดการสินค้า</h2>

          <p>
            เพิ่มสินค้า ตั้งราคา สต็อก และสถานะ
          </p>

        </div>

        <button
          id="addProductButton"
          class="primary-button"
        >
          + เพิ่มสินค้า
        </button>

      </div>


      <div
        id="productsList"
        class="items-list"
      ></div>

    </section>

  </section>


  <!-- ========================================
       GAME MODAL
  ========================================= -->

  <div
    id="gameModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="gameModalTitle">
          เพิ่มเกม
        </h2>

        <button
          id="closeGameModal"
          class="close-button"
        >
          ×
        </button>

      </div>


      <form id="gameForm">

        <input
          type="hidden"
          id="gameId"
        >


        <div class="form-group">

          <label>
            ชื่อเกม
          </label>

          <input
            type="text"
            id="gameName"
            required
          >

        </div>


        <div class="form-group">

          <label>
            Slug
          </label>

          <input
            type="text"
            id="gameSlug"
            placeholder="efootball"
            required
          >

        </div>


        <div class="form-group">

          <label>
            รายละเอียดเกม
          </label>

          <textarea
            id="gameDescription"
            rows="4"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            URL ไอคอนเกม
          </label>

          <input
            type="url"
            id="gameIconUrl"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label>
            URL แบนเนอร์เกม
          </label>

          <input
            type="url"
            id="gameBannerUrl"
            placeholder="https://..."
          >

        </div>


        <div class="form-group">

          <label>
            ลำดับ
          </label>

          <input
            type="number"
            id="gameSortOrder"
            value="0"
          >

        </div>


        <label class="checkbox-row">

          <input
            type="checkbox"
            id="gameActive"
            checked
          >

          <span>
            แสดงเกมบนร้าน
          </span>

        </label>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelGameButton"
            class="secondary-button"
          >
            ยกเลิก
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            บันทึกเกม
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- ========================================
       PRODUCT MODAL
  ========================================= -->

  <div
    id="productModal"
    class="modal hidden"
  >

    <div class="modal-box">

      <div class="modal-header">

        <h2 id="productModalTitle">
          เพิ่มสินค้า
        </h2>

        <button
          id="closeProductModal"
          class="close-button"
        >
          ×
        </button>

      </div>


      <form id="productForm">

        <input
          type="hidden"
          id="productId"
        >


        <div class="form-group">

          <label>
            เกม
          </label>

          <select
            id="productGame"
            required
          ></select>

        </div>


        <div class="form-group">

          <label>
            ชื่อสินค้า
          </label>

          <input
            type="text"
            id="productName"
            required
          >

        </div>


        <div class="form-group">

          <label>
            ราคา
          </label>

          <input
            type="number"
            id="productPrice"
            min="0"
            step="0.01"
            required
          >

        </div>


        <div class="form-group">

          <label>
            จำนวนสต็อก
          </label>

          <input
            type="number"
            id="productStock"
            min="0"
            value="1"
            required
          >

        </div>


        <div class="form-group">

          <label>
            รายละเอียด
          </label>

          <textarea
            id="productDescription"
            rows="4"
          ></textarea>

        </div>


        <div class="form-group">

          <label>
            รูปสินค้า
          </label>

          <input
            type="file"
            id="productImage"
            accept="image/*"
          >

          <small>
            เลือกรูปจาก iPad ได้
          </small>

        </div>


        <div class="form-group">

          <label>
            ลำดับสินค้า
          </label>

          <input
            type="number"
            id="productSortOrder"
            value="0"
          >

        </div>


        <div class="form-group">

          <label>
            สถานะ
          </label>

          <select id="productStatus">

            <option value="available">
              พร้อมขาย
            </option>

            <option value="sold_out">
              สินค้าหมด
            </option>

            <option value="hidden">
              ซ่อนสินค้า
            </option>

          </select>

        </div>


        <div class="modal-actions">

          <button
            type="button"
            id="cancelProductButton"
            class="secondary-button"
          >
            ยกเลิก
          </button>

          <button
            type="submit"
            class="primary-button"
          >
            บันทึกสินค้า
          </button>

        </div>

      </form>

    </div>

  </div>


  <!-- ========================================
       SCRIPTS
  ========================================= -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="supabase.js"></script>

  <script src="admin.js"></script>

</body>
</html>
